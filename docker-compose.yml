# =============================================================================
# docker-compose.yml — nm-services (Desarrollo local)
# Levanta PostgreSQL + Redis para desarrollo.
# Los microservicios NestJS corren con `npm run start:dev:<service>`.
#
# Para producción usar nm-deploy/docker-compose.prod.yml (stack completo + nginx).
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nm_services
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    volumes:
      - nm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (colas + cache futuro) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nm_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Storage Service (NestJS — subida local de archivos) ───────────────────
  storage-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: storage-service
    container_name: nm_storage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: storage-service
      APP_PORT: 3008
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:3000/api/v1/storage/files
      STORAGE_SERVICE_KEY: nm-storage-dev-key-change-in-production
    volumes:
      - storage_uploads:/data/uploads
    ports:
      - '3010:3008'   # host 3010 — evita conflicto con ai-engine si el stack full está activo
    networks:
      - default
    # No depende de postgres — el storage solo guarda archivos en disco

  # ── Ecommerce Service (storefront config) ─────────────────────────────────
  ecommerce-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ecommerce-service
    container_name: nm_ecommerce
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: ecommerce-service
      APP_PORT: 3012
      DATABASE_URL: postgresql://postgres:password@postgres:5432/nm_services
      REDIS_URL: redis://redis:6379
      HEADER_CACHE_TTL_SECONDS: 300
    ports:
      - '3012:3012'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  # ── Invoicing Service (Laravel + Greenter — polyglot PHP) ─────────────────
  invoicing:
    build:
      context: ./services/invoicing
      dockerfile: Dockerfile.dev
    container_name: nm_invoicing
    restart: unless-stopped
    env_file:
      - ./services/invoicing/.env
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nm_services
      DB_USERNAME: postgres
      DB_PASSWORD: password
    ports:
      - '3009:8000'
    volumes:
      - ./services/invoicing:/var/www/invoicing
      - invoicing_vendor:/var/www/invoicing/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # ── PgAdmin (opcional — GUI para PostgreSQL) ───────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nm.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']  # Solo con: docker-compose --profile tools up

volumes:
  nm_postgres_data:
  invoicing_vendor:
  storage_uploads:

networks:
  default:
    name: nm_network
    driver: bridge
