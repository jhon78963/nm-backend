# Promtail — recolecta logs Docker de microservicios NM → Loki.
# Solo contenedores con label logging=promtail (ver docker-compose.full.yml).

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nm-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_app"]
        target_label: app
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            event: event
            requestId: requestId
            statusCode: statusCode
            method: method
            path: path
            targetService: targetService
            durationMs: durationMs
            error: error
      - labels:
          level:
          service:
          event:
      - timestamp:
          source: timestamp
          format: RFC3339
          fallback_formats:
            - RFC3339Nano

  - job_name: nm-observability
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["nm_loki", "nm_promtail", "nm_grafana"]

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
