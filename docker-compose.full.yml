# =============================================================================
# docker-compose.full.yml — nm-services (Stack completo)
# Incluye: PostgreSQL + Redis + todos los microservicios NestJS
# Uso: ./scripts/start-docker-env.sh   (o ver ese script para comandos exactos)
# =============================================================================

x-depends-postgres-migrated: &depends-postgres-migrated
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
    - .env.docker
  depends_on: *depends-postgres-migrated
  networks:
    - default

services:

  # ── Infraestructura ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: nm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nm_services}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - nm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: nm_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  # ── Migración (corre una vez y sale) ─────────────────────────────────────────

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: nm_migrate
    restart: 'no'
    env_file:
      - .env
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nm_services}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-nm_services}
      LARAVEL_SOURCE_DB: nm_db
      RUN_LARAVEL_ETL: ${RUN_LARAVEL_ETL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # ── Microservicios ────────────────────────────────────────────────────────────

  gateway:
    <<: *service-defaults
    container_name: nm_gateway
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      SERVICE_NAME: gateway
      APP_PORT: 3000
      GATEWAY_PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      POS_SERVICE_URL: http://pos-service:3004
      FINANCE_SERVICE_URL: http://finance-service:3005
      HR_SERVICE_URL: http://hr-service:3006
      REPORT_SERVICE_URL: http://report-service:3007
      DOCUMENT_SERVICE_URL: http://document-service:3011
      AI_ENGINE_URL: http://ai-engine:8000
      INVOICING_SERVICE_URL: http://invoicing-service:8000
      STORAGE_SERVICE_URL: http://storage-service:3008
      ECOMMERCE_SERVICE_URL: http://ecommerce-service:3012
      CHATBOT_SERVICE_URL: http://chatbot-service:3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      pos-service:
        condition: service_started
      finance-service:
        condition: service_started
      hr-service:
        condition: service_started
      report-service:
        condition: service_started
      document-service:
        condition: service_started
      ai-engine:
        condition: service_started
      invoicing-service:
        condition: service_started
      chatbot-service:
        condition: service_started
      storage-service:
        condition: service_started
      ecommerce-service:
        condition: service_started
      mail-service:
        condition: service_started

  auth-service:
    <<: *service-defaults
    container_name: nm_auth
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    environment:
      SERVICE_NAME: auth-service
      APP_PORT: 3001
      STORAGE_SERVICE_URL: http://storage-service:3008
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
      MAIL_SERVICE_URL: http://mail-service:3013
      MAIL_SERVICE_KEY: ${MAIL_SERVICE_KEY:-nm-mail-dev-key-change-in-production}
      ECOMMERCE_STORE_URL: ${ECOMMERCE_STORE_URL:-http://localhost:3015}
      ECOMMERCE_SERVICE_URL: http://ecommerce-service:3012
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-nm-internal-dev-key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-service:
        condition: service_started
      mail-service:
        condition: service_started

  catalog-service:
    <<: *service-defaults
    container_name: nm_catalog
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      SERVICE_NAME: catalog-service
      APP_PORT: 3002
      STORAGE_SERVICE_URL: http://storage-service:3008
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-service:
        condition: service_started

  inventory-service:
    <<: *service-defaults
    container_name: nm_inventory
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      SERVICE_NAME: inventory-service
      APP_PORT: 3003
    ports:
      - '3003:3003'

  pos-service:
    <<: *service-defaults
    container_name: nm_pos
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: pos-service
    environment:
      SERVICE_NAME: pos-service
      APP_PORT: 3004
    ports:
      - '3004:3004'

  finance-service:
    <<: *service-defaults
    container_name: nm_finance
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: finance-service
    environment:
      SERVICE_NAME: finance-service
      APP_PORT: 3005
      STORAGE_SERVICE_URL: http://storage-service:3008
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
    ports:
      - '3005:3005'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-service:
        condition: service_started

  hr-service:
    <<: *service-defaults
    container_name: nm_hr
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: hr-service
    environment:
      SERVICE_NAME: hr-service
      APP_PORT: 3006
    ports:
      - '3006:3006'

  ecommerce-service:
    <<: *service-defaults
    container_name: nm_ecommerce
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ecommerce-service
    environment:
      SERVICE_NAME: ecommerce-service
      APP_PORT: 3012
      REDIS_URL: redis://redis:6379
      HEADER_CACHE_TTL_SECONDS: 300
      STORAGE_SERVICE_URL: http://storage-service:3008
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
      MAIL_SERVICE_URL: http://mail-service:3013
      MAIL_SERVICE_KEY: ${MAIL_SERVICE_KEY:-nm-mail-dev-key-change-in-production}
      ECOMMERCE_STORE_URL: ${ECOMMERCE_STORE_URL:-http://localhost:3015}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-nm-internal-dev-key}
    # Sin puerto publicado: solo red interna Docker (storefront vía ECOMMERCE_SERVICE_URL).
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-service:
        condition: service_started
      mail-service:
        condition: service_started

  report-service:
    <<: *service-defaults
    container_name: nm_report
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: report-service
    environment:
      SERVICE_NAME: report-service
      APP_PORT: 3007
      AI_ENGINE_URL: http://ai-engine:8000
      DOCUMENT_SERVICE_URL: http://document-service:3011
      DOCUMENT_SERVICE_KEY: ${DOCUMENT_SERVICE_KEY:-nm-document-dev-key-change-in-production}
    ports:
      - '3007:3007'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_started
      document-service:
        condition: service_started

  document-service:
    <<: *service-defaults
    container_name: nm_document
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: document-service
    environment:
      SERVICE_NAME: document-service
      APP_PORT: 3011
      DOCUMENT_SERVICE_KEY: ${DOCUMENT_SERVICE_KEY:-nm-document-dev-key-change-in-production}
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
    ports:
      - '3011:3011'

  storage-service:
    <<: *service-defaults
    container_name: nm_storage
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: storage-service
    environment:
      SERVICE_NAME: storage-service
      APP_PORT: 3008
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:3000/api/v1/storage/files
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
    volumes:
      - storage_uploads:/data/uploads
    ports:
      - '3010:3008'   # host 3010 — evita conflicto con ai-engine (3008:8000)
    # El volumen montado puede ser root-owned; asegurar permisos al iniciar
    user: root
    command: >
      sh -c "mkdir -p /data/uploads &&
             chown -R nestjs:nestjs /data/uploads &&
             exec node dist/apps/storage-service/apps/storage-service/src/main.js"

  mail-service:
    <<: *service-defaults
    container_name: nm_mail
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: mail-service
    environment:
      SERVICE_NAME: mail-service
      APP_PORT: 3013
      MAIL_SERVICE_KEY: ${MAIL_SERVICE_KEY:-nm-mail-dev-key-change-in-production}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Novedades Maritex}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      ZOHO_USER: ${ZOHO_USER:-}
      ZOHO_APP_PASSWORD: ${ZOHO_APP_PASSWORD:-}
      ZOHO_SMTP_HOST: ${ZOHO_SMTP_HOST:-smtp.zoho.com}
      ZOHO_SMTP_PORT: ${ZOHO_SMTP_PORT:-465}
      ECOMMERCE_STORE_URL: ${ECOMMERCE_STORE_URL:-http://localhost:3015}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      MAIL_LOGO_URL: ${MAIL_LOGO_URL:-}
      MAIL_BANNER_URL: ${MAIL_BANNER_URL:-}
      MAIL_SUPPORT_EMAIL: ${MAIL_SUPPORT_EMAIL:-}
      MAIL_SOCIAL_FACEBOOK: ${MAIL_SOCIAL_FACEBOOK:-}
      MAIL_SOCIAL_INSTAGRAM: ${MAIL_SOCIAL_INSTAGRAM:-}
      MAIL_SOCIAL_TIKTOK: ${MAIL_SOCIAL_TIKTOK:-}
      # Siempre redis://redis dentro de Docker (no usar ${REDIS_URL} del host .env)
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      MAIL_QUEUE_ENABLED: ${MAIL_QUEUE_ENABLED:-true}
      MAIL_QUEUE_CONCURRENCY: ${MAIL_QUEUE_CONCURRENCY:-5}
    ports:
      - '3013:3013'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ── Invoicing Service (Laravel 12 + Greenter — polyglot PHP) ────────────────

  invoicing-service:
    build:
      context: ./services/invoicing
      dockerfile: Dockerfile.dev
    container_name: nm_invoicing
    restart: unless-stopped
    env_file:
      - ./services/invoicing/.env
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-nm_services}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '3009:8000'
    volumes:
      - ./services/invoicing:/var/www/invoicing
      - invoicing_vendor:/var/www/invoicing/vendor
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default

  # ── AI Engine (Python/FastAPI — polyglot, fuera del toolchain NestJS) ────────

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: nm_ai_engine
    restart: unless-stopped
    env_file:
      - ./services/ai-engine/.env
    volumes:
      - ./services/ai-engine/models:/app/models
    ports:
      - '3008:8000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default

  # ── Chatbot Service (Node/Express — WhatsApp Malu, PostgreSQL compartido) ───

  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot/Dockerfile
      target: production
    container_name: nm_chatbot
    image: nm-chatbot:latest
    restart: unless-stopped
    env_file:
      - ./services/chatbot/.env
    environment:
      NODE_ENV: production
      SERVICE_NAME: nm-chatbot
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nm_services}
      ADMIN_PANEL_DIST: /app/admin/dist
      CORS_ORIGINS: ${CHATBOT_CORS_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost:3015}
      ADMIN_CORS_ORIGIN: ${CHATBOT_ADMIN_CORS_ORIGIN:-http://localhost:8080}
    ports:
      - '${CHATBOT_PORT:-8090}:3000'
    volumes:
      - nm_chatbot_uploads:/app/uploads
    init: true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default

  # ── Herramientas opcionales ────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nm.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']
    networks:
      - default

volumes:
  # Nombres fijos (sin prefijo de proyecto) para que los datos sobrevivan
  # aunque cambies el nombre del proyecto Compose.
  nm_postgres_data:
    name: nm_postgres_data
  invoicing_vendor:
    name: nm_invoicing_vendor
  storage_uploads:
    name: nm_storage_uploads
  nm_chatbot_uploads:
    name: nm_chatbot_uploads

networks:
  default:
    name: nm_network
    driver: bridge
